name: Test isolated VirtualApp engine candidate

on:
  push:
    branches:
      - calcvault-renjana-engine-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout VirtualApp candidate source (isolated CI only)
        uses: actions/checkout@v4
        with:
          repository: f0restw0w/VirtualApp_16
          ref: main
          path: candidate

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;21.4.7075529"

      - name: Verify candidate source and native modules
        working-directory: candidate
        run: |
          test -f gradlew
          test -f settings.gradle
          test -f app/build.gradle
          test -d lib/src/main/jni
          echo "Candidate source structure found; no CalcVault files are changed by this job."

      - name: Build candidate debug APK
        working-directory: candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: List APK outputs
        working-directory: candidate
        run: find app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload candidate APKs for review
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-candidate-debug-apks
          path: candidate/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 5

  smoke-test-emulator:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download candidate APK artifact
        uses: actions/download-artifact@v4
        with:
          name: virtualapp-candidate-debug-apks
          path: candidate-apks

      - name: Boot Android emulator and smoke-test host app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            echo "Downloaded artifact contents:"
            find candidate-apks -type f -print
            APK="$(find candidate-apks -type f -iname '*universal.apk' -print -quit)"
            if [ -z "$APK" ]; then
              APK="$(find candidate-apks -type f -iname '*.apk' -print -quit)"
            fi
            if [ -z "$APK" ]; then
              echo "No APK file was found in the downloaded artifact."
              exit 1
            fi
            echo "Installing candidate APK: $APK"
            adb install "$APK"
            adb shell monkey -p io.va.exposed64 -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
            adb logcat -d -t 5000 > candidate-logcat.txt
            if grep -E 'FATAL EXCEPTION|Fatal signal|Process: io.va.exposed64' candidate-logcat.txt; then
              echo "Candidate host app reported a fatal crash during startup."
              exit 1
            fi
            echo "Host APK installed and launch command completed without a detected fatal crash."
