name: Test isolated VirtualApp engine candidate

on:
  push:
    branches:
      - calcvault-renjana-engine-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout VirtualApp candidate source (isolated CI only)
        uses: actions/checkout@v4
        with:
          repository: f0restw0w/VirtualApp_16
          ref: main
          path: candidate

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;21.4.7075529"

      - name: Verify candidate source and native modules
        working-directory: candidate
        run: |
          test -f gradlew
          test -f settings.gradle
          test -f app/build.gradle
          test -d lib/src/main/jni
          echo "Candidate source structure found; no CalcVault files are changed by this job."

      - name: Build candidate debug APK
        working-directory: candidate
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Create harmless guest-app isolation test
        run: |
          mkdir -p guest-test/app/src/main/java/com/example/guestisolationtest
          cp candidate/gradlew guest-test/gradlew
          cp -R candidate/gradle guest-test/gradle
          chmod +x guest-test/gradlew
          cat > guest-test/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "GuestIsolationTest"
          include(":app")
          EOF
          cat > guest-test/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF
          cat > guest-test/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > guest-test/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.guestisolationtest'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.example.guestisolationtest'
                  minSdk 21
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > guest-test/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Guest Isolation Test" android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > guest-test/app/src/main/java/com/example/guestisolationtest/MainActivity.java <<'EOF'
          package com.example.guestisolationtest;

          import android.app.Activity;
          import android.os.Bundle;
          import android.graphics.Typeface;
          import android.view.Gravity;
          import android.widget.TextView;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.nio.charset.StandardCharsets;
          import java.util.UUID;

          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  String marker;
                  File markerFile = new File(getFilesDir(), "instance-marker.txt");
                  try {
                      if (!markerFile.exists()) {
                          byte[] value = ("INSTANCE-" + UUID.randomUUID()).getBytes(StandardCharsets.UTF_8);
                          try (FileOutputStream out = new FileOutputStream(markerFile)) { out.write(value); }
                      }
                      byte[] bytes = new byte[(int) markerFile.length()];
                      try (java.io.FileInputStream in = new java.io.FileInputStream(markerFile)) {
                          int count = in.read(bytes);
                          marker = new String(bytes, 0, Math.max(0, count), StandardCharsets.UTF_8);
                      }
                  } catch (Exception e) {
                      marker = "MARKER-ERROR-" + e.getClass().getSimpleName();
                  }
                  android.util.Log.i("GuestIsolationTest", "INSTANCE_MARKER=" + marker);
                  TextView view = new TextView(this);
                  view.setGravity(Gravity.CENTER);
                  view.setTextSize(20);
                  view.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
                  view.setText("GUEST_ISOLATION_TEST\n" + marker);
                  setContentView(view);
              }
          }
          EOF
          cd guest-test
          ./gradlew --no-daemon assembleDebug
          cd ..

      - name: List APK outputs
        run: |
          find candidate/app/build/outputs/apk guest-test/app/build/outputs/apk -type f -name '*.apk' -print

      - name: Upload candidate and guest test APKs
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-candidate-debug-apks
          path: |
            candidate/app/build/outputs/apk/**/*.apk
            guest-test/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 5

  smoke-test-emulator:
    needs: build-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        # Run one emulator at a time to avoid exhausting the GitHub runner's memory.
        api-level: [34]
    name: Smoke test Android API ${{ matrix.api-level }}
    steps:
      - name: Check out emulator test script
        uses: actions/checkout@v4
      - name: Download candidate and guest APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: virtualapp-candidate-debug-apks
          path: candidate-apks

      - name: Boot Android emulator and smoke-test host app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/virtualapp-emulator-smoke-test.sh
        env:
          API_LEVEL: ${{ matrix.api-level }}
