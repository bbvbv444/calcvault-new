name: Build CalcVault existing sources in isolated Gradle root

on:
  workflow_dispatch:
  push:
    branches:
      - calcvault-gradle-source-build-test
    paths:
      - "calc-source-build/**"
      - "app/src/main/**"
      - ".github/workflows/build-calcvault-source-test.yml"

permissions:
  contents: read

jobs:
  build-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.9
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.9-bin.zip --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Compile and package mapped CalcVault sources
        working-directory: calc-source-build
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: calcvault-existing-source-gradle-test-apk
          path: calc-source-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
